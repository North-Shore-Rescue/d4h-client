[project]
name = "d4h-client"
version = "0.2.0"
description = "A small, team-agnostic Python client for the D4H Team Manager v3 API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.urls]
Repository = "https://github.com/North-Shore-Rescue/d4h-client"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d4h"]
